# Motorust, the game (its content, its themes and its own plugins, `src/`),
# over the engine: the `motorust_engine` crate, from its repository
# (jgermade/motorust-engine) at the tag below. To work on both at once,
# with the engine's clone beside this one, see docs/building.md ("The
# engine"). See ROADMAP.md, "The engine apart from the game".

[package]
name = "motorust"
version = "0.0.22"
edition = "2024"
rust-version = "1.95"

[dependencies]
# Its version is its tag: to take a new one, change it here and in
# [dev-dependencies] alike.
motorust-engine = { git = "https://github.com/jgermade/motorust-engine", tag = "v0.0.26" }
# The engine's Bevy and serde (the same versions its Cargo.toml asks for):
# one of each in the lock, so the two never differ.
bevy = { version = "0.19", features = ["jpeg", "serialize"] }
serde = { version = "1", features = ["derive"] }

# Development only (`make up`): Bevy linked dynamically, so that after a
# change only the game is linked again, in seconds rather than with the
# whole of Bevy. Never in a release build: src/main.rs refuses it there.
[features]
dynamic = ["bevy/dynamic_linking"]

# The game's tests run the engine's checks on the game's content (see
# src/game/checks.rs).
[dev-dependencies]
motorust-engine = { git = "https://github.com/jgermade/motorust-engine", tag = "v0.0.26", features = ["testing"] }

# En Windows, incrusta el icono en el ejecutable (.exe).
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# En desarrollo, nuestro código se compila con optimización ligera (compila
# rápido) y las dependencias con optimización completa (Bevy en modo debug
# sin optimizar va a pocos FPS).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Build final: máximo rendimiento a cambio de compilar más lento.
[profile.release]
codegen-units = 1
lto = "thin"
