# The workspace: the game (this package, Motorust: its content, its themes
# and its own plugins, `src/`) over the engine (`motorust-engine/`, the
# `motorust_engine` crate). See ROADMAP.md, "The engine apart from the game".
[workspace]
members = ["motorust-engine"]

[package]
name = "motorust"
version = "0.0.17"
edition = "2024"
rust-version = "1.95"

[dependencies]
motorust-engine = { path = "motorust-engine" }
# The engine's Bevy and serde (as its own Cargo.toml asks for them, so that
# it builds on its own too): one of each in the lock, so the two never
# differ.
bevy = { version = "0.19", features = ["jpeg", "serialize"] }
serde = { version = "1", features = ["derive"] }

# The game's tests run the engine's checks on the game's content (see
# src/game/checks.rs).
[dev-dependencies]
motorust-engine = { path = "motorust-engine", features = ["testing"] }

# En Windows, incrusta el icono en el ejecutable (.exe).
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# En desarrollo, nuestro código se compila con optimización ligera (compila
# rápido) y las dependencias con optimización completa (Bevy en modo debug
# sin optimizar va a pocos FPS).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Build final: máximo rendimiento a cambio de compilar más lento.
[profile.release]
codegen-units = 1
lto = "thin"
