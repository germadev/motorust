# Checks the engine on every push to main and every pull request: its
# format, clippy with warnings as errors, and its tests, on its own content
# (assets/) only.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  # What Bevy needs to build on Linux.
  LINUX_PACKAGES: >-
    g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0
    libwayland-dev libxkbcommon-dev clang lld

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
