# La versión web del juego en GitHub Pages: se publica en GitHub Pages sólo
# al hacer una release llamado desde release.yml, reutilizando el build
# de WebAssembly generado por build.yml.
#
# En Settings → Pages, la fuente tiene que ser «GitHub Actions».
name: Pages

on:
  workflow_call:

# Una publicación detrás de otra.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web
      - id: deployment
        uses: actions/deploy-pages@v4

