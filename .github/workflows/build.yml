# Pasa los tests y compila el juego para Linux, Windows, macOS (Apple
# Silicon e Intel) y WebAssembly. Cada build queda como artefacto del run: un
# .tar.gz (o un .zip en Windows y WebAssembly) con el ejecutable o la versión
# web lista para servir, que lleva dentro todos los modelos, texturas y
# sonidos, y el README.
#
# Corre en cada push a main y en cada PR, a mano desde la pestaña Actions y
# llamado desde release.yml, que le pasa la versión con la que se compila.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner_preference:
        description: Preferencia de runner (auto, self-hosted, github-hosted)
        type: choice
        options:
          - auto
          - self-hosted
          - github-hosted
        default: auto
      cross_compile_windows:
        description: Compilar Windows desde Linux (cross-compilation con cargo-xwin)
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: Versión con la que se compila, sin la v (por ejemplo 1.2.0)
        type: string
        required: false
        default: ""
      runner_preference:
        description: Preferencia de runner (auto, self-hosted, github-hosted)
        type: string
        required: false
        default: auto
      cross_compile_windows:
        description: Compilar Windows desde Linux (cross-compilation con cargo-xwin)
        type: boolean
        required: false
        default: false

# En una PR, un push nuevo cancela el run anterior. Llamado desde release.yml,
# el grupo es el de la release y no choca con los de aquí.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  # Lo que Bevy necesita para compilar en Linux (lo mismo que `make install`).
  LINUX_PACKAGES: >-
    g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0
    libwayland-dev libxkbcommon-dev zip clang lld

jobs:
  detect-runner:
    name: Detectar runners
    runs-on: ubuntu-latest
    outputs:
      linux_runner: ${{ steps.detect.outputs.linux_runner }}
      build_matrix: ${{ steps.detect.outputs.build_matrix }}
    steps:
      - name: Comprobar disponibilidad de runners
        id: detect
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN || secrets.PAT_TOKEN || github.token }}
          PREFERENCE: ${{ inputs.runner_preference || 'auto' }}
          CROSS_WINDOWS: ${{ inputs.cross_compile_windows || false }}
        run: |
          echo "=== Preferencia de runner: $PREFERENCE ==="

          use_self_hosted_linux=false
          use_self_hosted_macos=false

          if [ "$PREFERENCE" = "self-hosted" ]; then
            echo "Preferencia manual: forzar self-hosted."
            use_self_hosted_linux=true
          elif [ "$PREFERENCE" = "github-hosted" ]; then
            echo "Preferencia manual: forzar GitHub-hosted."
            use_self_hosted_linux=false
          else
            echo "Modo auto: consultando runners registrados en el repositorio..."
            runners_json=""
            if runners_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runners" 2>/dev/null); then
              echo "Respuesta de la API de runners recibida con éxito."

              # Buscar runner Linux self-hosted online
              online_linux=$(echo "$runners_json" | jq -r '
                .runners[]?
                | select(.status == "online")
                | select(.os == "Linux" or (.labels[]?.name | ascii_downcase == "linux"))
                | .name' | head -n 1)

              if [ -n "$online_linux" ]; then
                echo "✓ Runner self-hosted Linux online detectado: $online_linux"
                use_self_hosted_linux=true
              else
                echo "✗ No hay runner self-hosted Linux online."
              fi

              # Buscar runner macOS self-hosted online (preparado para Mac mini)
              online_macos=$(echo "$runners_json" | jq -r '
                .runners[]?
                | select(.status == "online")
                | select(.os == "macOS" or (.labels[]?.name | ascii_downcase == "macos"))
                | .name' | head -n 1)

              if [ -n "$online_macos" ]; then
                echo "✓ Runner self-hosted macOS online detectado: $online_macos"
                use_self_hosted_macos=true
              fi
            else
              echo "⚠️ No se pudo consultar la API de runners con el token actual."
              echo "Para detección automática, añade un Personal Access Token (PAT) con permiso 'Administration: Read' en los Secrets como RUNNER_CHECK_TOKEN."
              echo "Usando runners de GitHub por defecto para evitar bloqueos."
            fi
          fi

          if [ "$use_self_hosted_linux" = true ]; then
            echo "linux_runner=[\"self-hosted\", \"linux\"]" >> "$GITHUB_OUTPUT"
            linux_os='["self-hosted", "linux"]'
          else
            echo "linux_runner=[\"ubuntu-latest\"]" >> "$GITHUB_OUTPUT"
            linux_os='"ubuntu-latest"'
          fi

          if [ "$use_self_hosted_macos" = true ]; then
            macos_arm_os='["self-hosted", "macos", "ARM64"]'
          else
            macos_arm_os='"macos-latest"'
          fi

          if [ "$CROSS_WINDOWS" = "true" ]; then
            echo "✓ Cross-compilación a Windows habilitada: se compilará en el runner Linux."
            windows_os="$linux_os"
          else
            windows_os='"windows-latest"'
          fi

          matrix_json=$(jq -n \
            --argjson linux_os "$linux_os" \
            --argjson windows_os "$windows_os" \
            --argjson macos_os "$macos_arm_os" \
            '{
              include: [
                {
                  name: "Linux x86_64",
                  os: $linux_os,
                  target: "x86_64-unknown-linux-gnu"
                },
                {
                  name: "Windows x86_64",
                  os: $windows_os,
                  target: "x86_64-pc-windows-msvc"
                },
                {
                  name: "macOS Apple Silicon",
                  os: $macos_os,
                  target: "aarch64-apple-darwin"
                },
                {
                  name: "macOS Intel",
                  os: "macos-latest",
                  target: "x86_64-apple-darwin"
                }
              ]
            }')

          echo "build_matrix=$(echo "$matrix_json" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "Matriz configurada:"
          echo "$matrix_json" | jq .

  test:
    name: Tests, formato y clippy
    needs: detect-runner
    runs-on: ${{ fromJSON(needs.detect-runner.outputs.linux_runner) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Dependencias de Linux
        run: |
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
          elif command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" -eq 0 ]; then
            apt-get update && apt-get install -y --no-install-recommends $LINUX_PACKAGES
          else
            echo "Continuando sin sudo apt-get (en runner self-hosted las dependencias deben estar preinstaladas)."
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  build:
    name: Build ${{ matrix.name }}
    needs: [detect-runner, test]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-runner.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES
          elif command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" -eq 0 ]; then
            apt-get update && apt-get install -y --no-install-recommends $LINUX_PACKAGES
          else
            echo "Continuando sin sudo apt-get (en runner self-hosted las dependencias deben estar preinstaladas)."
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Versión
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            # La de la release: va en Cargo.toml para que el ejecutable la lleve.
            perl -0pi -e 's/^version = "[^"]*"/version = "'"$VERSION"'"/m' Cargo.toml
            echo "label=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "label=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar cargo-xwin
        if: runner.os == 'Linux' && contains(matrix.target, 'windows')
        uses: taiki-e/install-action@cargo-xwin
      - name: Compilar
        run: |
          if [ "$RUNNER_OS" = "Linux" ] && [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cargo xwin build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Empaquetar
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ steps.version.outputs.label }}
        run: |
          name="motorust-$LABEL-$TARGET"
          mkdir -p "dist/$name"
          cp README.md assets/CREDITS.md "dist/$name/"
          if [[ "$TARGET" == *"windows"* ]]; then
            cp "target/$TARGET/release/motorust.exe" "dist/$name/"
            if command -v 7z >/dev/null 2>&1; then
              (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
            else
              (cd dist && zip -r "$name.zip" "$name" > /dev/null)
            fi
            rm -r "dist/$name"
          elif [ "$RUNNER_OS" = macOS ]; then
            # 1. Binario tradicional para terminal (.tar.gz)
            cp "target/$TARGET/release/motorust" "dist/$name/"
            (cd dist && tar czf "$name.tar.gz" "$name")
            rm -r "dist/$name"

            # 2. Aplicación nativa de macOS (.app en .zip)
            mkdir -p "dist/$name-app"
            tools/make-app.sh "target/$TARGET/release/motorust" "$LABEL" "dist/$name-app"
            cp README.md assets/CREDITS.md "dist/$name-app/"
            (cd "dist/$name-app" && zip -r -y "../$name-app.zip" "Motorust.app" README.md CREDITS.md > /dev/null)
            rm -r "dist/$name-app"
          else
            cp "target/$TARGET/release/motorust" "dist/$name/"
            (cd dist && tar czf "$name.tar.gz" "$name")
            rm -r "dist/$name"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: motorust-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  wasm:
    name: Build WebAssembly
    needs: [detect-runner, test]
    runs-on: ${{ fromJSON(needs.detect-runner.outputs.linux_runner) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      - name: wasm-bindgen
        run: |
          # La misma versión que la librería en Cargo.lock, o no se entienden.
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "wasm-bindgen $version"
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $version" ]; then
            cargo install wasm-bindgen-cli --locked --version "$version"
          fi
      - name: Versión
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            # La de la release: va en Cargo.toml para que la web la lleve.
            perl -0pi -e 's/^version = "[^"]*"/version = "'"$VERSION"'"/m' Cargo.toml
            echo "label=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "label=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Compilar
        run: web/build.sh dist/web
      - name: Empaquetar
        env:
          TARGET: wasm32-unknown-unknown
          LABEL: ${{ steps.version.outputs.label }}
        run: |
          name="motorust-$LABEL-$TARGET"
          mkdir -p "dist-pkg/$name"
          cp -r dist/web/* README.md assets/CREDITS.md "dist-pkg/$name/"
          (cd dist-pkg && zip -r "$name.zip" "$name" > /dev/null)
          rm -r "dist-pkg/$name"
          ls -l dist-pkg
      - uses: actions/upload-artifact@v4
        with:
          name: motorust-wasm32-unknown-unknown
          path: dist-pkg/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/web
          if-no-files-found: error

